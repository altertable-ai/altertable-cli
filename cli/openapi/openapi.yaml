        principal:
          "$ref": "#/components/schemas/Principal"
        organization:
          "$ref": "#/components/schemas/Organization"
        authentication_scope:
          type: string
        environment_slug:
          anyOf:
            - type: string
            - type: "null"
      required:
        - principal
        - organization
        - authentication_scope

  responses:
    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

paths:
  /whoami:
    get:
      operationId: whoami
      summary: Identify the authenticated principal
      description: Returns the principal (user or service account) and organization associated with the API key.
      tags: [Authentication]
      responses:
        "200":
          description: Authenticated principal and organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhoamiResponse"
              examples:
                user:
                  summary: User principal
                  value:
                    principal:
                      id: "019d7223-796e-7917-8d7e-ca256daa7979"
                      type: User
                      name: Jane Doe
                      email: jane@example.com
                    organization:
                      id: "019d7223-796e-7917-8d7e-ca256daa7980"
                      name: Acme Corp
                      slug: acme-corp
                service_account:
                  summary: ServiceAccount principal
                  value:
                    principal:
                      id: "019d7223-796e-7917-8d7e-ca256daa7981"
                      type: ServiceAccount
                      name: CI Deploy
                      slug: ci-deploy
                    organization:
                      id: "019d7223-796e-7917-8d7e-ca256daa7980"
                      name: Acme Corp
                      slug: acme-corp
        "401":
          $ref: "#/components/responses/Unauthorized"

  /environments/{id}:
    get:
      operationId: getEnvironment
      summary: Get an environment by ID or slug
      tags: [Environments]
      parameters:
        - name: id
          in: path
          required: true
          description: Environment UUID or slug
          schema:
            type: string
            examples:
              - "019d7223-796e-7917-8d7e-ca256daa7979"
              - "production"
      responses:
        "200":
          description: Environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteEnvironment
      summary: Delete an environment
      tags: [Environments]
      parameters:
        - name: id
          in: path
          required: true
          description: Environment UUID or slug
          schema:
            type: string
            examples:
              - "019d7223-796e-7917-8d7e-ca256daa7979"
              - "production"
      responses:
        "204":
          description: Environment deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /environments:
