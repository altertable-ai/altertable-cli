  /environments/{environment_id}/service_accounts:
    post:
      operationId: createEnvironmentServiceAccount
      summary: Create a service account scoped to a single environment
      description: |
        Creates a service account whose roles are confined to the given environment. `caveats`
        defaults to read-only on the whole environment; pass `"rw"` for read-write, or an object
        mapping catalog names to `"ro"`/`"rw"` to grant access per catalog. Authenticate with the
        Altertable CLI and pass `with_service_oauth_token: true` to receive a one-time
        `service_oauth_token` for the new service account; it expires at the same time as the
        CLI token used to create it.
      tags: [Service Accounts]
      parameters:
        - name: environment_id
          in: path
          required: true
          description: Environment UUID or slug
          schema:
            type: string
            examples:
              - "019d7223-796e-7917-8d7e-ca256daa7979"
              - "production"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnvironmentServiceAccountRequest"
            examples:
              environmentReadOnly:
                summary: Read-only on the whole environment
                value:
                  label: CI Deploy
              withServiceOauthToken:
                summary: Issue a follow-up CLI OAuth token for the service account
                value:
                  label: CI Deploy
                  with_service_oauth_token: true
              perCatalog:
                summary: Read on one catalog, write on another
                value:
                  label: CI Deploy
                  caveats:
                    analytics: ro
                    staging: rw
      responses:
        "201":
          description: Service account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentServiceAccountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

